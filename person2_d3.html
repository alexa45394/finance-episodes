<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asset Identity — Old Money vs New Money</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --old-color: #185FA5;
    --new-color: #0F6E56;
    --base-color: #5F5E5A;
    --old-bg: #E6F1FB;
    --new-bg: #E1F5EE;
    --base-bg: #F1EFE8;
    --text-primary: #1a1a1a;
    --text-secondary: #5F5E5A;
    --text-muted: #888780;
    --border: #e2e0d8;
    --surface: #fafaf8;
    --card-bg: #ffffff;
    --grid-line: #f0ede6;
    font-family: 'Georgia', serif;
  }

  body {
    background: var(--surface);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 32px 24px;
    max-width: 900px;
    margin: 0 auto;
  }

  /* ── Episode selector ─────────────────────────── */
  .ep-section { margin-bottom: 28px; }

  .ep-label {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .ep-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .ep-btn {
    padding: 7px 15px;
    font-size: 13px;
    font-family: 'Georgia', serif;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--card-bg);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s ease;
    line-height: 1;
  }
  .ep-btn:hover { border-color: #aaa; color: var(--text-primary); }
  .ep-btn.active {
    background: var(--text-primary);
    border-color: var(--text-primary);
    color: #fff;
    font-style: italic;
  }

  .story-line {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.65;
    margin-top: 12px;
    padding-left: 12px;
    border-left: 2px solid var(--border);
  }

  /* ── Asset grid ───────────────────────────────── */
  .section-label {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .asset-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 8px;
    margin-bottom: 20px;
  }

  .asset-card {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card-bg);
    cursor: pointer;
    transition: all 0.15s ease;
    border-left-width: 3px;
    user-select: none;
  }
  .asset-card:hover { border-color: #bbb; }
  .asset-card.selected { box-shadow: 0 0 0 1.5px var(--text-primary); }
  .asset-card.old  { border-left-color: var(--old-color); }
  .asset-card.new  { border-left-color: var(--new-color); }
  .asset-card.base { border-left-color: var(--base-color); }

  .card-ticker { font-size: 10px; color: var(--text-muted); margin-bottom: 2px; font-family: monospace; }
  .card-name   { font-size: 12px; font-weight: bold; color: var(--text-primary); margin-bottom: 3px; }
  .card-group  { font-size: 10px; font-style: italic; }
  .card-group.old  { color: var(--old-color); }
  .card-group.new  { color: var(--new-color); }
  .card-group.base { color: var(--base-color); }

  /* ── Info panel ───────────────────────────────── */
  .info-panel {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 22px;
    background: var(--card-bg);
    margin-bottom: 24px;
    display: none;
  }
  .info-panel.visible { display: block; }

  .info-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .group-badge {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 3px;
    font-style: italic;
  }
  .group-badge.old  { background: var(--old-bg);  color: var(--old-color); }
  .group-badge.new  { background: var(--new-bg);  color: var(--new-color); }
  .group-badge.base { background: var(--base-bg); color: var(--base-color); }

  .info-name {
    font-size: 20px;
    font-weight: bold;
    color: var(--text-primary);
  }
  .info-ticker {
    font-size: 13px;
    color: var(--text-muted);
    font-family: monospace;
    font-weight: normal;
    margin-left: 4px;
  }

  .info-desc {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.65;
    margin-bottom: 14px;
  }

  .stat-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .stat-box {
    flex: 1;
    min-width: 100px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 10px 14px;
  }
  .stat-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; letter-spacing: 0.04em; }
  .stat-val   { font-size: 18px; font-weight: bold; }
  .stat-val.pos { color: var(--new-color); }
  .stat-val.neg { color: #A32D2D; }
  .stat-val.neutral { color: var(--text-primary); }

  /* ── Chart section ────────────────────────────── */
  .chart-section {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 22px;
    background: var(--card-bg);
  }

  .chart-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chart-title { font-size: 15px; font-weight: bold; color: var(--text-primary); }
  .chart-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .annotation-pill {
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-style: italic;
    white-space: nowrap;
  }

  .legend {
    display: flex;
    gap: 20px;
    margin-bottom: 14px;
    font-size: 12px;
    color: var(--text-secondary);
    align-items: center;
  }
  .leg-item { display: flex; align-items: center; gap: 7px; }

  .leg-line {
    width: 28px;
    height: 2px;
    border-radius: 1px;
  }
  .leg-line.old { background: var(--old-color); }
  .leg-line.new {
    background: repeating-linear-gradient(
      90deg,
      var(--new-color) 0, var(--new-color) 5px,
      transparent 5px, transparent 9px
    );
  }

  #chart-container { width: 100%; }

  /* D3 chart styles */
  .axis path, .axis line { stroke: var(--border); stroke-width: 0.5px; }
  .axis text { fill: var(--text-muted); font-size: 11px; font-family: 'Georgia', serif; }
  .grid-line { stroke: var(--grid-line); stroke-width: 0.5px; }
  .baseline-line { stroke: var(--border); stroke-width: 1px; stroke-dasharray: 3 3; }

  .line-old { fill: none; stroke: var(--old-color); stroke-width: 2px; }
  .line-new { fill: none; stroke: var(--new-color); stroke-width: 2px; stroke-dasharray: 7 4; }

  .tooltip-box {
    position: absolute;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 8px 12px;
    font-size: 12px;
    font-family: 'Georgia', serif;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.1s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    min-width: 130px;
    z-index: 10;
  }
  .tooltip-day { font-size: 11px; color: var(--text-muted); margin-bottom: 5px; }
  .tooltip-row { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 2px; }
  .tooltip-label { color: var(--text-secondary); }
  .tooltip-val { font-weight: bold; }

  .crosshair { stroke: var(--border); stroke-width: 1px; stroke-dasharray: 3 3; opacity: 0; }
</style>
</head>
<body>

<!-- Episode selector -->
<div class="ep-section">
  <div class="ep-label">Market episode</div>
  <div class="ep-bar" id="ep-bar"></div>
  <div class="story-line" id="story-line"></div>
</div>

<!-- Asset grid -->
<div class="section-label">Select an asset to learn more</div>
<div class="asset-grid" id="asset-grid"></div>

<!-- Info panel -->
<div class="info-panel" id="info-panel"></div>

<!-- Chart -->
<div class="chart-section">
  <div class="chart-header">
    <div>
      <div class="chart-title">Old money vs new money</div>
      <div class="chart-subtitle">Average value of $100 invested at episode start</div>
    </div>
    <div class="annotation-pill" id="annotation-pill"></div>
  </div>
  <div class="legend">
    <div class="leg-item">
      <div class="leg-line old"></div>
      <span>Old money (avg)</span>
    </div>
    <div class="leg-item">
      <div class="leg-line new"></div>
      <span>New money (avg)</span>
    </div>
  </div>
  <div id="chart-container"></div>
</div>

<!-- Tooltip -->
<div class="tooltip-box" id="tooltip"></div>

volatility_pct":1.08}],"episodes":[{"episode":"Dot-Com Crash","start":"2000-03-10","end":"2002-10-09","story":"Tech stocks fell sharply after the internet bubble burst."},{"episode":"Global Financial Crisis","start":"2007-10-09","end":"2009-03-09","story":"Banks and financial assets fell during the housing and credit crisis."},{"episode":"COVID Crash","start":"2020-02-19","end":"2020-06-30","story":"A sudden shutdown shocked the whole market, but some assets recovered faster than others."},{"episode":"2022 Inflation Shock","start":"2022-01-03","end":"2022-12-30","story":"Rising rates hurt growth stocks, bonds, and many assets that were supposed to diversify risk."},{"episode":"Regional Banking Crisis","start":"2023-03-06","end":"2023-05-31","story":"Banks became the fragile asset class, while parts of tech held up better."},{"episode":"AI Rally","start":"2023-01-03","end":"2024-12-31","story":"Semiconductors, Bitcoin, and large tech became major winners in the new wealth cycle."}],"crossovers":{"Dot-Com Crash":{"label":"New money craters","note":"Tech bubble bursts — new money collapses while old money holds steady"},"Global Financial Crisis":{"label":"Old money falls too","note":"Banks drag down traditional assets as credit crisis deepens"},"COVID Crash":{"label":"New money recovers first","note":"Tech bounces back faster than old-economy stocks"},"2022 Inflation Shock":{"label":"Neither side wins","note":"Rising rates hurt both groups — nowhere to hide"},"Regional Banking Crisis":{"label":"Banks fracture","note":"Old money hit hard as regional banks collapse"},"AI Rally":{"label":"New money dominates","note":"Semiconductors and Bitcoin surge in the new wealth cycle"}}};

const ASSETS = {
  SPY:     { name:'S&P 500',          group:'Baseline', cls:'base', desc:'Tracks the 500 largest US companies. The benchmark everything else is measured against.' },
  XLF:     { name:'Financials',        group:'Old money', cls:'old', desc:'Banks, insurers, and investment firms — the backbone of traditional finance.' },
  KRE:     { name:'Regional Banks',    group:'Old money', cls:'old', desc:'Smaller local banks that lend to businesses and homeowners in their communities.' },
  XLE:     { name:'Energy',            group:'Old money', cls:'old', desc:'Oil, gas, and energy companies. Tied to commodity prices and global demand.' },
  XLU:     { name:'Utilities',         group:'Old money', cls:'old', desc:'Electric and gas utilities. Slow and steady — known for stability and dividends.' },
  TLT:     { name:'Long Bonds',        group:'Old money', cls:'old', desc:'US government bonds maturing 20+ years out. Usually a safe haven — but not always.' },
  GLD:     { name:'Gold',              group:'Old money', cls:'old', desc:'The original store of value. Tends to rise when investors fear uncertainty.' },
  QQQ:     { name:'Nasdaq 100',        group:'New money', cls:'new', desc:'The 100 largest non-financial tech companies. Home of Apple, Microsoft, and Nvidia.' },
  XLK:     { name:'Technology',        group:'New money', cls:'new', desc:'Software, hardware, and tech giants — the engine of modern economic growth.' },
  SMH:     { name:'Semiconductors',    group:'New money', cls:'new', desc:'Chipmakers like Nvidia and TSMC. The picks-and-shovels of the digital economy.' },
  ARKK:    { name:'Innovation Stocks', group:'New money', cls:'new', desc:'High-growth bets on disruptive companies — genomics, robotics, fintech. High risk, high reward.' },
  'BTC-USD':{ name:'Bitcoin',          group:'New money', cls:'new', desc:'The first cryptocurrency. Extremely volatile — it can double or halve in months.' },
};

// ─── State ───────────────────────────────────────────────────────────────────
let currentEpisode = 'COVID Crash';
let selectedAsset  = null;

// ─── Helpers ─────────────────────────────────────────────────────────────────
const getEpisodeAssets = ep =>
  [...new Set(RAW.summary.filter(r => r.episode === ep).map(r => r.ticker))]
    .filter(t => ASSETS[t]);

const getSummary = (ep, ticker) =>
  RAW.summary.find(r => r.episode === ep && r.ticker === ticker);

const fmtRet = v => (v >= 0 ? '+' : '') + v.toFixed(1) + '%';

// ─── Episode bar ─────────────────────────────────────────────────────────────
function buildEpBar() {
  const bar = document.getElementById('ep-bar');
  bar.innerHTML = '';
  RAW.episodes.forEach(ep => {
    const btn = document.createElement('button');
    btn.className = 'ep-btn' + (ep.episode === currentEpisode ? ' active' : '');
    btn.textContent = ep.episode;
    btn.addEventListener('click', () => {
      currentEpisode = ep.episode;
      selectedAsset  = null;
      render();
    });
    bar.appendChild(btn);
  });

  const ep     = RAW.episodes.find(e => e.episode === currentEpisode);
  const cross  = RAW.crossovers[currentEpisode];
  const suffix = cross ? ' ' + cross.note + '.' : '';
  document.getElementById('story-line').textContent = ep ? ep.story + suffix : '';
  document.getElementById('annotation-pill').textContent = cross ? cross.label : '';
}

// ─── Asset grid ──────────────────────────────────────────────────────────────
function buildAssetGrid() {
  const grid    = document.getElementById('asset-grid');
  const tickers = getEpisodeAssets(currentEpisode);
  grid.innerHTML = '';
  tickers.forEach(t => {
    const a    = ASSETS[t];
    const card = document.createElement('div');
    card.className = 'asset-card ' + a.cls + (selectedAsset === t ? ' selected' : '');
    card.innerHTML = `
      <div class="card-ticker">${t}</div>
      <div class="card-name">${a.name}</div>
      <div class="card-group ${a.cls}">${a.group}</div>`;
    card.addEventListener('click', () => {
      selectedAsset = selectedAsset === t ? null : t;
      render();
    });
    grid.appendChild(card);
  });
}

// ─── Info panel ──────────────────────────────────────────────────────────────
function buildInfoPanel() {
  const panel = document.getElementById('info-panel');
  if (!selectedAsset) { panel.className = 'info-panel'; return; }
  const a   = ASSETS[selectedAsset];
  const row = getSummary(currentEpisode, selectedAsset);
  const ret = row ? row.total_return_pct : null;
  const dd  = row ? row.max_drawdown     : null;

  panel.className = 'info-panel visible';
  panel.innerHTML = `
    <div class="info-header">
      <span class="group-badge ${a.cls}">${a.group}</span>
      <span class="info-name">${a.name}<span class="info-ticker">${selectedAsset}</span></span>
    </div>
    <div class="info-desc">${a.desc}</div>
    ${row ? `<div class="stat-row">
      <div class="stat-box">
        <div class="stat-label">Total return</div>
        <div class="stat-val ${ret >= 0 ? 'pos' : 'neg'}">${fmtRet(ret)}</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Worst drop</div>
        <div class="stat-val neg">${dd.toFixed(1)}%</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">$100 became</div>
        <div class="stat-val neutral">$${row.end_value.toFixed(0)}</div>
      </div>
    </div>` : ''}`;
}

// ─── D3 chart ────────────────────────────────────────────────────────────────
function buildChart() {
  const container = document.getElementById('chart-container');
  container.innerHTML = '';

  // Dimensions
  const totalW = container.clientWidth || 860;
  const margin = { top: 16, right: 40, bottom: 40, left: 52 };
  const W      = totalW - margin.left - margin.right;
  const H      = 280;

  // Data
  const rows  = RAW.oldVsNew.filter(r => r.episode === currentEpisode);
  const days  = [...new Set(rows.map(r => r.episode_day))].sort((a, b) => a - b);
  const oldMap = new Map(), newMap = new Map();
  rows.forEach(r => {
    if (r.group === 'Old money') oldMap.set(r.episode_day, r.indexed_100);
    else                         newMap.set(r.episode_day, r.indexed_100);
  });

  const oldSeries = days.map(d => ({ day: d, val: oldMap.get(d) ?? null })).filter(d => d.val != null);
  const newSeries = days.map(d => ({ day: d, val: newMap.get(d) ?? null })).filter(d => d.val != null);
  const allVals   = [...oldSeries, ...newSeries].map(d => d.val);

  // Scales
  const xScale = d3.scaleLinear()
    .domain([0, d3.max(days)])
    .range([0, W]);

  const [yMin, yMax] = d3.extent(allVals);
  const yPad = (yMax - yMin) * 0.08;
  const yScale = d3.scaleLinear()
    .domain([Math.min(yMin - yPad, 98), yMax + yPad])
    .range([H, 0])
    .nice();

  // SVG
  const svg = d3.select(container)
    .append('svg')
      .attr('width',  totalW)
      .attr('height', H + margin.top + margin.bottom)
    .append('g')
      .attr('transform', `translate(${margin.left},${margin.top})`);

  // Grid lines
  svg.append('g')
    .attr('class', 'grid')
    .call(
      d3.axisLeft(yScale)
        .ticks(5)
        .tickSize(-W)
        .tickFormat('')
    )
    .call(g => {
      g.select('.domain').remove();
      g.selectAll('line').attr('class', 'grid-line');
    });

  // $100 baseline
  svg.append('line')
    .attr('class', 'baseline-line')
    .attr('x1', 0).attr('x2', W)
    .attr('y1', yScale(100)).attr('y2', yScale(100));

  // Axes
  svg.append('g')
    .attr('class', 'axis')
    .attr('transform', `translate(0,${H})`)
    .call(
      d3.axisBottom(xScale)
        .ticks(6)
        .tickFormat(d => d === 0 ? 'Day 0' : `Day ${d}`)
    )
    .call(g => g.select('.domain').attr('stroke', '#e2e0d8'));

  svg.append('g')
    .attr('class', 'axis')
    .call(
      d3.axisLeft(yScale)
        .ticks(5)
        .tickFormat(d => '$' + d3.format('.0f')(d))
    )
    .call(g => g.select('.domain').remove());

  // Line generators
  const lineGen = key => d3.line()
    .x(d => xScale(d.day))
    .y(d => yScale(d.val))
    .curve(d3.curveCatmullRom.alpha(0.5))
    .defined(d => d.val != null);

  // Old money line
  svg.append('path')
    .datum(oldSeries)
    .attr('class', 'line-old')
    .attr('d', lineGen('old')(oldSeries));

  // New money line
  svg.append('path')
    .datum(newSeries)
    .attr('class', 'line-new')
    .attr('d', lineGen('new')(newSeries));

  // ── Crosshair + tooltip interaction ──────────────────────────────────────
  const tooltip   = document.getElementById('tooltip');
  const crosshair = svg.append('line')
    .attr('class', 'crosshair')
    .attr('y1', 0).attr('y2', H);

  const bisect = d3.bisector(d => d.day).left;

  svg.append('rect')
    .attr('width', W).attr('height', H)
    .attr('fill', 'transparent')
    .on('mousemove', function(event) {
      const [mx] = d3.pointer(event);
      const day  = Math.round(xScale.invert(mx));

      // Find nearest old + new values
      const oi = bisect(oldSeries, day);
      const ni = bisect(newSeries, day);
      const oRow = oldSeries[Math.min(oi, oldSeries.length - 1)];
      const nRow = newSeries[Math.min(ni, newSeries.length - 1)];

      crosshair
        .attr('x1', mx).attr('x2', mx)
        .attr('opacity', 1);

      tooltip.style.opacity = '1';
      const rect = container.getBoundingClientRect();
      const left = event.clientX - rect.left + 16;
      tooltip.style.left = (left + 160 > totalW ? left - 170 : left) + 'px';
      tooltip.style.top  = (event.clientY - rect.top - 20) + 'px';

      tooltip.innerHTML = `
        <div class="tooltip-day">Day ${day}</div>
        <div class="tooltip-row">
          <span class="tooltip-label" style="color:#185FA5">Old money</span>
          <span class="tooltip-val">${oRow ? '$' + oRow.val.toFixed(1) : '—'}</span>
        </div>
        <div class="tooltip-row">
          <span class="tooltip-label" style="color:#0F6E56">New money</span>
          <span class="tooltip-val">${nRow ? '$' + nRow.val.toFixed(1) : '—'}</span>
        </div>`;
    })
    .on('mouseleave', () => {
      crosshair.attr('opacity', 0);
      tooltip.style.opacity = '0';
    });
}

// ─── Render ──────────────────────────────────────────────────────────────────
function render() {
  buildEpBar();
  buildAssetGrid();
  buildInfoPanel();
  buildChart();
}

render();
window.addEventListener('resize', () => buildChart());
</script>
